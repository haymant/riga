[package]
name = "riga-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

authors = ["RIGA Contributors"]
description = "Transport-free RIGA coding-agent kernel"

[dependencies]
futures-util = "0.3"
rig-agent = { version = "=0.43.0", features = ["test-utils"] }
rig-core = "=0.43.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
