[package]
name = "riga-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "RIGA command-line adapter"

[features]
# GPU backend selection, e.g. `cargo install riga-cli --features cuda`. The
# server owns the actual features; `cuda` builds llama.cpp/ggml as shared
# libraries (see crates/riga-server/Cargo.toml).
default = []
cuda = ["riga-server/cuda"]
metal = ["riga-server/metal"]

[dependencies]
riga-kernel = { version = "0.1.14", path = "../riga-kernel" }
riga-server = { version = "0.1.14", path = "../riga-server" }
base64 = "0.22.1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
pulldown-cmark = "0.13"
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }

[lints]
workspace = true
