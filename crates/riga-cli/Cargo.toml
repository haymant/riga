[package]
name = "riga-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "RIGA command-line adapter"

[dependencies]
riga-kernel = { version = "0.1.0", path = "../riga-kernel" }
riga-server = { version = "0.1.0", path = "../riga-server" }
base64 = "0.22.1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.29"
pulldown-cmark = "0.13"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
