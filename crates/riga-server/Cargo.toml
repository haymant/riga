[package]
name = "riga-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "RIGA authenticated HTTP adapter"

[features]
# Backend selection is explicit so the default build stays portable. Enabling
# `cuda` requires an NVIDIA driver and CUDA toolkit on the *build* machine; it is
# not switched on merely by running the app on a CUDA-capable computer. Enabling
# `metal` needs macOS / Apple Silicon build tools (Xcode / Metal).
default = []
cuda = ["llama-cpp-2/cuda"]
metal = ["llama-cpp-2/metal"]

[dependencies]
async-stream = "0.3"
aes-gcm = "0.11"
axum = { version = "0.8", features = ["multipart", "ws"] }
encoding_rs = "0.8"
futures-util = "0.3"
glob = "0.3"
# Local GGUF inference. `common` pulls the CPU kernels and `openmp` enables
# multi-threaded CPU inference; the `cuda` feature above adds GPU offload.
llama-cpp-2 = { version = "0.1.158", default-features = false, features = ["common", "openmp"] }
# Only for the `ggml_log_level` argument of `LlamaModelParams::fit_params`, which
# llama-cpp-2 does not re-export. Safe to reference; no `unsafe` is used here.
llama-cpp-sys-2 = "0.1.158"
rig-agent = { version = "=0.43.0", features = ["test-utils"] }
rig-core = "=0.43.0"
riga-kernel = { version = "0.1.0", path = "../riga-kernel" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rig-rmcp = "=0.43.0"
rmcp = { version = "=2.0.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "io-std"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
walkdir = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[lints]
workspace = true
