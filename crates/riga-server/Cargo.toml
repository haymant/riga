[package]
name = "riga-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "RIGA authenticated HTTP adapter"

[dependencies]
async-stream = "0.3"
aes-gcm = "0.10"
axum = { version = "0.8", features = ["multipart", "ws"] }
futures-util = "0.3"
riga-kernel = { version = "0.1.0", path = "../riga-kernel" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "io-std"] }
walkdir = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[lints]
workspace = true
