[package]
name = "riga-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Forward the inference backends so `tauri build --features cuda|metal` works.
# Both stay off by default, keeping the portable CPU build the norm.
default = []
cuda = ["riga-server/cuda"]
metal = ["riga-server/metal"]

[dependencies]
# The released desktop app has no dev server to talk to, so the shell hosts the
# same `riga-server` HTTP/WebSocket adapter the browser build is proxied to. The
# kernel stays transport-neutral; this only decides who owns the socket.
axum = "0.8"
riga-kernel = { path = "../../../crates/riga-kernel" }
riga-server = { path = "../../../crates/riga-server" }
# Native-shell startup helpers (GTK/WebKitGTK display prep).
riga-shell = { path = "../../../crates/riga-shell" }
tauri = { version = "2.0", default-features = false, features = ["wry"] }
# Tauri opens a second window for every `target="_blank"` link by default —
# which the surface uses for the model-license links and all chat Markdown. The
# opener plugin injects a click handler that redirects those to the system
# browser instead, so no link can spawn a blank second window.
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[lints]
workspace = true
