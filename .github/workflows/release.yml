name: Release RIGA desktop app

on:
  push:
    tags:
      - "v*.*.*"
  # Optional GPU variants are slow, so they are off on tag pushes and only run
  # when requested from the Actions UI.
  workflow_dispatch:
    inputs:
      build_linux_cuda:
        description: "Also build linux-cuda (slow; installs the CUDA toolkit)"
        type: boolean
        default: false
      build_macos_metal:
        description: "Also build macos-metal (slow; Metal toolchain)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - name: Compose the platform matrix
        id: set
        run: |
          include='[
            {"platform":"linux","os":"ubuntu-22.04","args":"","rust-targets":"","features":"","enable_cuda":false,"enable_metal":false,"release":true},
            {"platform":"windows","os":"windows-latest","args":"","rust-targets":"","features":"","enable_cuda":false,"enable_metal":false,"release":true},
            {"platform":"macos","os":"macos-latest","args":"--target aarch64-apple-darwin","rust-targets":"aarch64-apple-darwin","features":"","enable_cuda":false,"enable_metal":false,"release":true}
          ]'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_linux_cuda }}" = "true" ]; then
            include=$(printf '%s' "$include" | jq -c '. + [{"platform":"linux-cuda","os":"ubuntu-22.04","args":"","rust-targets":"","features":"cuda","enable_cuda":true,"enable_metal":false,"release":false}]')
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_macos_metal }}" = "true" ]; then
            include=$(printf '%s' "$include" | jq -c '. + [{"platform":"macos-metal","os":"macos-latest","args":"--target aarch64-apple-darwin","rust-targets":"aarch64-apple-darwin","features":"metal","enable_cuda":false,"enable_metal":true,"release":false}]')
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "Matrix: $include"

  desktop:
    name: Build desktop app (${{ matrix.platform }})
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            build-essential \
            pkg-config \
            clang

      - name: Install CUDA Toolkit
        if: matrix.enable_cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.6.3"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt
          targets: ${{ matrix.rust-targets }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # macOS: the CPU build turns Metal off (its linker workaround). The Metal
      # build keeps Metal on and links the toolchain's compiler-rt archive, which
      # provides `___isPlatformVersionAtLeast` — a symbol Rust's `-nodefaultlibs`
      # link omits, so without it the Metal build fails to link.
      - name: Set macOS build environment
        if: runner.os == 'macOS'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          if [ "${{ matrix.enable_metal }}" = "true" ]; then
            echo "GGML_METAL=ON" >> "$GITHUB_ENV"
            resource_dir="$(clang -print-resource-dir)"
            echo "RUSTFLAGS=-C link-arg=${resource_dir}/lib/darwin/libclang_rt.osx.a" >> "$GITHUB_ENV"
            xcodebuild -downloadComponent MetalToolchain || true
          else
            echo "GGML_METAL=OFF" >> "$GITHUB_ENV"
          fi

      # CPU build: attached to the tagged GitHub release.
      - name: Build and upload RIGA
        if: matrix.release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/riga
          tagName: ${{ github.ref_name }}
          releaseName: RIGA ${{ github.ref_name }}
          releaseBody: |
            Desktop release for RIGA ${{ github.ref_name }}.

            Download the installer for your operating system from the assets below.

            - `linux` / `windows` / `macos` — CPU builds
            - `linux-cuda` / `macos-metal` — optional GPU builds, produced on demand
              from the Actions UI and published as workflow artifacts (not attached
              here, because they would replace the CPU installers of the same name)
          releaseDraft: false
          prerelease: false
          args: >-
            ${{ matrix.args }}
            ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}

      # Optional GPU variant: compile-only, published as a workflow artifact.
      - name: Build RIGA (build-only variant)
        if: ${{ !matrix.release }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/riga
          args: >-
            ${{ matrix.args }}
            ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}

      - name: Upload build-only bundles
        if: ${{ !matrix.release }}
        uses: actions/upload-artifact@v4
        with:
          name: riga-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            apps/riga/src-tauri/target/release/bundle/**
            apps/riga/src-tauri/target/*/release/bundle/**
