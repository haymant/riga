name: Release RIGA desktop app

on:
  push:
    tags:
      - "v*.*.*"
  # A manual run builds ONLY the variant selected below: the cpu and metal jobs
  # are gated on a tag push, so checking this box rebuilds just linux-cuda.
  workflow_dispatch:
    inputs:
      build_linux_cuda:
        description: "Build linux-cuda only (slow; installs the CUDA toolkit)"
        type: boolean
        default: false
      tag:
        description: "Release tag to attach the CUDA assets to (empty = the pushed tag)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. CPU builds: Linux and Windows. A separate CPU macOS build is deliberately
  #    absent — the Metal job below covers Apple Silicon and would otherwise
  #    write the same `RIGA_<version>_aarch64.dmg`.
  # ---------------------------------------------------------------------------
  cpu:
    name: Build desktop app (${{ matrix.platform }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: windows
            os: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            build-essential \
            pkg-config \
            clang

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install demo dependencies
        run: npm ci --prefix demo

      - name: Build and upload RIGA
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: demo
          tagName: ${{ github.ref_name }}
          releaseName: RIGA ${{ github.ref_name }}
          releaseBody: |
            Desktop release for RIGA ${{ github.ref_name }}.

            Download the installer for your operating system from the assets below.

            - `linux` / `windows` — CPU builds
            - `macos` — Apple Silicon with Metal (and CPU fallback)
            - `linux-cuda` — optional NVIDIA build, produced on demand and
              published as a `RIGA-CUDA-…` desktop bundle and a
              `RIGA-CLI-CUDA-…` CLI tarball (both need the NVIDIA driver and the
              matching CUDA runtime libraries)
          releaseDraft: false
          prerelease: false

  # ---------------------------------------------------------------------------
  # 2. Apple Silicon with Metal. Every aarch64 Mac supports Metal, and it still
  #    falls back to CPU, so there is no separate CPU macOS build.
  # ---------------------------------------------------------------------------
  metal:
    name: Build desktop app (macos-metal)
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt
          targets: aarch64-apple-darwin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install demo dependencies
        run: npm ci --prefix demo

      # Link the toolchain's compiler-rt archive, which provides
      # `___isPlatformVersionAtLeast` — a symbol Rust's `-nodefaultlibs` link
      # omits, so without it the Metal build fails to link.
      - name: Set macOS build environment
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          echo "GGML_METAL=ON" >> "$GITHUB_ENV"
          resource_dir="$(clang -print-resource-dir)"
          echo "RUSTFLAGS=-C link-arg=${resource_dir}/lib/darwin/libclang_rt.osx.a" >> "$GITHUB_ENV"
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Build and upload RIGA
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: demo
          tagName: ${{ github.ref_name }}
          releaseName: RIGA ${{ github.ref_name }}
          releaseBody: |
            Desktop release for RIGA ${{ github.ref_name }}.

            Download the installer for your operating system from the assets below.

            - `linux` / `windows` — CPU builds
            - `macos` — Apple Silicon with Metal (and CPU fallback)
            - `linux-cuda` — optional NVIDIA build, produced on demand and
              published as a `RIGA-CUDA-…` desktop bundle and a
              `RIGA-CLI-CUDA-…` CLI tarball (both need the NVIDIA driver and the
              matching CUDA runtime libraries)
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin --features metal

  # ---------------------------------------------------------------------------
  # 3. Linux with CUDA — manual only. Built without a release upload, then
  #    published under `RIGA-CUDA-`/`RIGA-CLI-CUDA-` prefixed names so they never
  #    replace the CPU installers (a CUDA binary needs `libcuda` plus the CUDA
  #    runtime libraries at runtime). llama.cpp is linked dynamically, so the
  #    desktop .deb carries the llama.cpp/ggml shared libraries under /usr/lib/riga
  #    and the CLI tarball ships them next to the executable.
  # ---------------------------------------------------------------------------
  cuda:
    name: Build desktop app and CLI (linux-cuda)
    if: github.event_name == 'workflow_dispatch' && inputs.build_linux_cuda
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            build-essential \
            pkg-config \
            clang

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.6.3"
          method: network
          # The action prefixes `cuda-` and appends `-<major>-<minor>`; `cublas`
          # is not a cuda-prefixed package (it is `libcublas`), so install the
          # toolkit meta-package instead: nvcc plus the cudart/cublas libraries
          # llama.cpp links, without the driver packages the `cuda`
          # meta-package would pull onto a GPU-less runner.
          sub-packages: '["toolkit"]'
          log-file-suffix: "linux-cuda.txt"

      # llama.cpp defaults to compiling for a long list of architectures (with
      # PTX variants), which dominates the build. These cover Turing through
      # Hopper; the build script forwards `CMAKE_*` env vars as CMake defines.
      #
      # `CUDA_LIBRARY_PATH` is the only variable the build script uses for the
      # linker search order (it appends `lib64`/`lib64/stubs` to each entry, so
      # pass the toolkit root). Pin it to the installed toolkit so `-lcuda` and
      # `-lcudart` cannot bind to a newer preinstalled CUDA (which drops
      # the `cudaGetDeviceProperties_v2` symbol) instead.
      - name: Configure CUDA build
        run: |
          echo "CMAKE_CUDA_ARCHITECTURES=75;80;86;89;90" >> "$GITHUB_ENV"
          # llama.cpp is built as shared libraries here, so its objects are PIC
          # by default; keep the flag explicit so a static fallback still links
          # into the demo's cdylib.
          echo "CMAKE_POSITION_INDEPENDENT_CODE=ON" >> "$GITHUB_ENV"
          echo "CMAKE_CUDA_FLAGS=-Xcompiler=-fPIC" >> "$GITHUB_ENV"
          if [ -n "${CUDA_PATH:-}" ]; then
            echo "CUDA_LIBRARY_PATH=${CUDA_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install demo dependencies
        run: npm ci --prefix demo

      - name: Build RIGA (CUDA)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: demo
          # Only a .deb: the AppImage step downloads tooling and rpm packaging is
          # slow. The CPU Linux release already ships the rpm and AppImage.
          args: --features cuda --bundles deb

      # The CLI links the same dynamic llama.cpp/ggml build. This runs in the
      # root workspace target and `riga-server`'s build script stages the shared
      # libraries next to the binary, so the tarball below only needs the user's
      # CUDA runtime.
      - name: Build RIGA CLI (CUDA)
        run: cargo build --release -p riga-cli --features riga-server/cuda

      - name: Package RIGA CLI (CUDA)
        run: |
          set -euo pipefail
          out="dist/riga-cli-cuda"
          rm -rf dist RIGA-CLI-CUDA-x86_64.tar.gz
          mkdir -p "$out"
          cp target/release/riga-cli "$out/"
          cp target/release/riga-cuda-libs/*.so.* "$out/"
          {
            echo "RIGA CLI with NVIDIA CUDA offload (dynamically linked)."
            echo
            echo "Extract and run:  ./riga-cli --tui    (or --health, --catalog, ...)"
            echo
            echo "Runtime requirements:"
            echo "  - the NVIDIA driver (libcuda.so.1)"
            echo "  - the CUDA Toolkit's cuBLAS/cuBLASLt/cudart on the loader path"
            echo "    (installing the toolkit configures this via ld.so.conf)"
            echo
            echo "The shared libraries are resolved relative to the executable"
            echo "(DT_RPATH \$ORIGIN)."
          } > "$out/README.txt"
          tar -C dist -czf RIGA-CLI-CUDA-x86_64.tar.gz riga-cli-cuda
          ls -la RIGA-CLI-CUDA-x86_64.tar.gz

      - name: Publish CLI CUDA tarball to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="${{ github.ref_name }}"
          gh release upload "$tag" RIGA-CLI-CUDA-x86_64.tar.gz --clobber

      - name: Publish CUDA bundles to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="${{ github.ref_name }}"
          shopt -s nullglob
          files=(demo/src-tauri/target/release/bundle/*/* demo/src-tauri/target/*/release/bundle/*/*)
          uploaded=0
          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            renamed="$(dirname "$file")/$(basename "$file" | sed 's/^RIGA/RIGA-CUDA/')"
            cp "$file" "$renamed"
            gh release upload "$tag" "$renamed" --clobber
            uploaded=$((uploaded + 1))
          done
          echo "Published $uploaded asset(s) to $tag"
          if [ "$uploaded" -eq 0 ]; then
            echo "::error::No bundle files found under demo/src-tauri/target/*/release/bundle"
            exit 1
          fi
