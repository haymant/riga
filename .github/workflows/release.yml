name: Release RIGA desktop app

on:
  push:
    tags:
      - "v*.*.*"
  # linux-cuda is slow and needs an NVIDIA driver to run, so it is manual only.
  workflow_dispatch:
    inputs:
      build_linux_cuda:
        description: "Also build linux-cuda (slow; installs the CUDA toolkit)"
        type: boolean
        default: false
      tag:
        description: "Release tag to attach the CUDA assets to (empty = the pushed tag)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
      has_jobs: ${{ steps.set.outputs.has_jobs }}
    steps:
      - name: Compose the platform matrix
        id: set
        run: |
          # A tag push builds the shipping set: linux, windows, and Apple
          # Silicon with Metal (every aarch64 Mac supports it, and it still
          # falls back to CPU). linux-cuda is slow and manual only.
          include='[]'
          if [ "${{ github.event_name }}" = "push" ]; then
            include='[
              {"platform":"linux","os":"ubuntu-22.04","args":"","rust-targets":"","features":"","enable_cuda":false,"enable_metal":false,"release":true},
              {"platform":"windows","os":"windows-latest","args":"","rust-targets":"","features":"","enable_cuda":false,"enable_metal":false,"release":true},
              {"platform":"macos-metal","os":"macos-latest","args":"--target aarch64-apple-darwin","rust-targets":"aarch64-apple-darwin","features":"metal","enable_cuda":false,"enable_metal":true,"release":true}
            ]'
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_linux_cuda }}" = "true" ]; then
            include=$(printf '%s' "$include" | jq -c '. + [{"platform":"linux-cuda","os":"ubuntu-22.04","args":"","rust-targets":"","features":"cuda","enable_cuda":true,"enable_metal":false,"release":false,"asset_prefix":"RIGA-CUDA"}]')
          fi
          # Collapse to one line: `$GITHUB_OUTPUT` cannot carry a raw newline.
          include=$(printf '%s' "$include" | jq -c '.')
          if [ "$include" = "[]" ]; then
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "Matrix: $include"

  desktop:
    name: Build desktop app (${{ matrix.platform }})
    needs: matrix
    # Skip entirely when a manual run selected no GPU variant (empty matrix).
    if: needs.matrix.outputs.has_jobs == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            build-essential \
            pkg-config \
            clang

      - name: Install CUDA Toolkit
        if: matrix.enable_cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.6.3"
          method: network
          # The action prefixes `cuda-` and appends `-<major>-<minor>`; `cublas`
          # is not a cuda-prefixed package (it is `libcublas`), so it belongs in
          # `non-cuda-sub-packages`. Install the toolkit meta-package instead:
          # it pulls nvcc plus the cudart/cublas dev packages (the static libs
          # llama.cpp links) without the driver packages the `cuda` meta pulls.
          sub-packages: '["toolkit"]'
          log-file-suffix: "linux-cuda.txt"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt
          targets: ${{ matrix.rust-targets }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # Every aarch64 Mac supports Metal, so the macOS build keeps it on. Link
      # the toolchain's compiler-rt archive, which provides
      # `___isPlatformVersionAtLeast` — a symbol Rust's `-nodefaultlibs` link
      # omits, so without it the Metal build fails to link.
      - name: Set macOS build environment
        if: runner.os == 'macOS'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          echo "GGML_METAL=ON" >> "$GITHUB_ENV"
          resource_dir="$(clang -print-resource-dir)"
          echo "RUSTFLAGS=-C link-arg=${resource_dir}/lib/darwin/libclang_rt.osx.a" >> "$GITHUB_ENV"
          xcodebuild -downloadComponent MetalToolchain || true

      # Release build: attached to the tagged GitHub release.
      - name: Build and upload RIGA
        if: matrix.release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/riga
          tagName: ${{ github.ref_name }}
          releaseName: RIGA ${{ github.ref_name }}
          releaseBody: |
            Desktop release for RIGA ${{ github.ref_name }}.

            Download the installer for your operating system from the assets below.

            - `linux` / `windows` — CPU builds
            - `macos` — Apple Silicon with Metal (and CPU fallback)
            - `linux-cuda` — optional NVIDIA build, produced on demand and
              published as a `RIGA-CUDA-…` asset (needs a CUDA driver to run)
          releaseDraft: false
          prerelease: false
          args: >-
            ${{ matrix.args }}
            ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}

      # Optional GPU variant: compile-only, published as a workflow artifact.
      - name: Build RIGA (build-only variant)
        if: ${{ !matrix.release }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/riga
          args: >-
            ${{ matrix.args }}
            ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}

      # GPU variants are published under a variant-prefixed asset name so they
      # never replace the CPU installer of the same name — a CUDA binary needs
      # `libcuda` at runtime and would break machines without an NVIDIA driver.
      - name: Publish GPU bundles to the release
        if: ${{ !matrix.release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="${{ github.ref_name }}"
          prefix="${{ matrix.asset_prefix }}"
          shopt -s nullglob
          files=(target/release/bundle/*/* target/*/release/bundle/*/*)
          uploaded=0
          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            renamed="$(dirname "$file")/$(basename "$file" | sed "s/^RIGA/$prefix/")"
            cp "$file" "$renamed"
            gh release upload "$tag" "$renamed" --clobber
            uploaded=$((uploaded + 1))
          done
          echo "Published $uploaded asset(s) to $tag"
          if [ "$uploaded" -eq 0 ]; then
            echo "::error::No bundle files found under target/*/release/bundle"
            exit 1
          fi
