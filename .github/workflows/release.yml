name: Release RIGA desktop app

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Build desktop app (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows
            os: windows-latest
            args: ""
            rust-targets: ""
          - platform: macos
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: aarch64-apple-darwin
          - platform: macos-intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-targets: x86_64-apple-darwin

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt
          targets: ${{ matrix.rust-targets }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # `riga-server` links llama.cpp, whose C++ uses `std::filesystem`. The SDK
      # marks that unavailable below macOS 10.15, so the default (older) target
      # fails the whole build with "'path' is unavailable: introduced in macOS
      # 10.15". Raise the deployment target for both the C++ and Rust compilers.
      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"

      - name: Build and upload RIGA
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/riga
          tagName: ${{ github.ref_name }}
          releaseName: RIGA ${{ github.ref_name }}
          releaseBody: |
            Desktop release for RIGA ${{ github.ref_name }}.

            Download the installer for your operating system from the assets below.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
